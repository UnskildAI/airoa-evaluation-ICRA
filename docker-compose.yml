services:
  policy_server:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        INSTALL_GR00T_FROM_SOURCE: ${INSTALL_GR00T_FROM_SOURCE:-0}
        GR00T_REPO_URL: ${GR00T_REPO_URL:-https://github.com/NVIDIA/Isaac-GR00T.git}
        GR00T_REF: ${GR00T_REF:-main}
    container_name: airoa_policy_server
    network_mode: host
    gpus: all
    environment:
      POLICY_SERVER_HOST: "0.0.0.0"
      POLICY_SERVER_PORT: ${POLICY_SERVER_PORT:-8000}
      POLICY_NAME: ${POLICY_NAME:-openpi}
      POLICY_CONFIG_NAME: ${POLICY_CONFIG_NAME:-}
      POLICY_CHECKPOINT_DIR: /policy_checkpoint
      POLICY_CHECKPOINT_PATH: ${POLICY_CHECKPOINT_PATH_IN_CONTAINER:-/policy_checkpoint}
      POLICY_CHECKPOINT_URI: ${POLICY_CHECKPOINT_URI:-}
      POLICY_CHECKPOINT_SHA256: ${POLICY_CHECKPOINT_SHA256:-}
      POLICY_DEVICE: ${POLICY_DEVICE:-}
      POLICY_SUBMISSION_CONFIG: ${POLICY_SUBMISSION_CONFIG:-}
      POLICY_DEFAULT_PROMPT: ${POLICY_DEFAULT_PROMPT:-}
      POLICY_RECORD_DIR: ${POLICY_RECORD_DIR:-}
      POLICY_PYTORCH_DEVICE: ${POLICY_PYTORCH_DEVICE:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_REGION: ${R2_REGION:-auto}
      POLICY_DATA_HOME: /policy_assets
      OPENPI_DATA_HOME: /policy_assets
      HF_HOME: /policy_hf_cache
    volumes:
      - ${POLICY_CHECKPOINT_PATH:-./.docker_cache/policy_checkpoint}:/policy_checkpoint:ro
      - ${POLICY_CACHE_DIR:-${OPENPI_CACHE_DIR:-./.docker_cache/policy_cache}}:/policy_assets
      - ${HF_CACHE_DIR:-./.docker_cache/hf}:/policy_hf_cache
    restart: unless-stopped

  hsr_client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: airoa_hsr_client
    network_mode: host
    privileged: true
    gpus: all
    depends_on:
      - policy_server
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      ROS_MASTER_URI: ${ROS_MASTER_URI:-http://127.0.0.1:11311}
      ROS_IP: ${ROS_IP:-127.0.0.1}
      POLICY_SERVER_HOST: ${POLICY_SERVER_HOST:-127.0.0.1}
      POLICY_SERVER_PORT: ${POLICY_SERVER_PORT:-8000}
      POLICY_SERVER_API_KEY: ${POLICY_SERVER_API_KEY:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
      - ${ROSBAG_DIR:-./datasets/rosbags}:/root/datasets/rosbags
    command: >-
      bash -lc "
      source /opt/ros/noetic/setup.bash &&
      source /root/catkin_ws/devel/setup.bash &&
      echo '[INFO] Client container is ready. Run roslaunch manually:' &&
      echo 'roslaunch hsr_policy_client hsr_policy_client.launch policy_server_host:=${POLICY_SERVER_HOST:-127.0.0.1} policy_server_port:=${POLICY_SERVER_PORT:-8000} policy_server_api_key:=${POLICY_SERVER_API_KEY:-}' &&
      sleep infinity
      "
