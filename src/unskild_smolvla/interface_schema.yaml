observation:
  ordered_keys:
    - head_rgb
    - hand_rgb
    - state
    - prompt
  strict_order: true
  strict_keys: true
  fields:
    head_rgb:
      required: true
      dtype: uint8
      shape: [480, 640, 3]
    hand_rgb:
      required: true
      dtype: uint8
      shape: [480, 640, 3]
    state:
      required: true
      dtype: float32
      shape: [8]
      finite: true
    prompt:
      required: true
      dtype: str
action:
  key: actions
  strict_keys: true
  dtype: float32
  shape: [T, 11]
  min_horizon: 1
  finite: true
  order:
    - arm_lift_joint
    - arm_flex_joint
    - arm_roll_joint
    - wrist_flex_joint
    - wrist_roll_joint
    - gripper
    - head_pan_joint
    - head_tilt_joint
    - base_x
    - base_y
    - base_t
